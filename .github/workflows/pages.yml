name: Web uygulamasını yayınla

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/pages.yml"]
  # Verileri 3 saatte bir yenile (saatler UTC; GitHub yoğunken birkaç dakika gecikebilir)
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dump:
        description: "Maç sonuçlarını iş özetine yaz (kontrol için)"
        type: boolean
        default: false
      force_odds:
        description: "Oranları şimdi yeniden çek ve kuponu yeniden hazırla"
        type: boolean
        default: false
      eval_model:
        description: "Model ağırlıklarını geriye dönük sına (iş özetine yazar)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Geçmiş sezon dosyaları (aralarındaki maçlar için) her seferinde yeniden indirilmesin
      - uses: actions/cache@v4
        with:
          path: .cache/fdco
          key: fdco-${{ github.run_id }}
          restore-keys: fdco-

      # Anahtar eklenmemişse bu adım atlanır ve sayfa içindeki verilerle yayınlanır.
      # Veri alınamazsa iş durur; önceki yayın (son güncel veriler) yerinde kalır.
      - name: Güncel verileri çek
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # İsteğe bağlı: sakat/cezalı oyuncular ve Süper Lig maçları için
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DUMP_RESULTS: ${{ inputs.dump }}
          # İsteğe bağlı: günün kuponu için bahis oranları
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_ODDS: ${{ inputs.force_odds }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::warning::FOOTBALL_DATA_TOKEN eklenmemiş, veriler güncellenmedi."
          else
            node scripts/update-data.mjs
          fi

      # Yeni oran geldiyse günün kuponunu sayfadaki modelle hazırla
      - name: Günün kuponunu hazırla
        timeout-minutes: 10
        env:
          EVAL_MODEL: ${{ inputs.eval_model }}
        run: |
          if [ -f web/data.json ] && { grep -q '"needCoupon":true' web/data.json || [ "$EVAL_MODEL" = "true" ]; }; then
            mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
            npx playwright install --with-deps chromium >/dev/null
            cd "$GITHUB_WORKSPACE" && PW_DIR=/tmp/pw node scripts/coupon.mjs
          else
            echo "Yeni oran yok; kupon değişmedi."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
